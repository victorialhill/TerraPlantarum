[project]
name = "pipeline"
version = "0.1.0"
description = "Ingestion, dbt, data quality and export for Terra Plantarum"
authors = [
    { name = "Victoria Hill", email = "vhill@wanderrootllc.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "dagster>=1.13.24",
    "dagster-postgres>=0.29.24",
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.0",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
