repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.4.0
    hooks:
      - id: sqlfluff-fix
  - repo: local
    hooks:
      - id: dotnet-format
        name: dotnet format
        entry: dotnet format api/TerraPlantarum.slnx --include
        language: system
        types: [c#]
        require_serial: true
